name: haohao_chifan
description: "好好吃饭 · 每日健康菜单 Flutter 版"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  health: ^13.3.2
  http: ^1.6.0
  image_picker: ^1.2.4
  pedometer: ^4.2.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
  fonts:
    - family: DisplaySerif
      fonts:
        - asset: assets/fonts/DisplaySerif.otf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Light.ttf
          weight: 300
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.ttf
